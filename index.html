<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteira de clientes</title>
<style>
:root{--bg:#EDF0F4;--card:#fff;--ink:#14202E;--mut:#5B6B7D;--line:#D8DFE8;--ok:#1F7A55;--warn:#B06F0B;--bad:#C0392B;--acc:#1F4E79;--chip:#E3E9F1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1620;--card:#18222F;--ink:#E7EDF4;--mut:#93A3B5;--line:#263445;--ok:#4CC38A;--warn:#E5A93B;--bad:#F0705F;--acc:#7FB2E5;--chip:#223042;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1620;--card:#18222F;--ink:#E7EDF4;--mut:#93A3B5;--line:#263445;--ok:#4CC38A;--warn:#E5A93B;--bad:#F0705F;--acc:#7FB2E5;--chip:#223042;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
button,select,input{font:inherit;color:inherit}
.tab{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.k small{color:var(--mut);display:block}.k b{font-size:21px}
.k.att{border-left:5px solid var(--bad);cursor:pointer}
.abc{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--chip);padding:6px 12px;border-radius:8px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],select{border:1px solid var(--line);background:var(--card);padding:7px 10px;border-radius:8px}
input[type=search]{flex:1;min-width:150px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mut);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;cursor:pointer}
.row.Ativo{border-left-color:var(--ok)}.row.Em\ risco{border-left-color:var(--warn)}.row.Inativo{border-left-color:var(--bad)}
.nm{font-weight:650;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--mut);font-size:13px;margin-top:3px}
.cl{display:inline-block;padding:1px 9px;border-radius:999px;font-weight:700;font-size:12px;background:#E3E6EA;color:#2B3440;border:1px solid transparent}
.c-Diamante{background:#BDE6FF;color:#08395A;border-color:#8CCBF2}
.c-Platina{background:#B9C5D8;color:#17263A;border-color:#98A8C0}
.c-Ouro{background:#F6D77A;color:#5A4200;border-color:#E2BC4A}
.c-Prata{background:#ECEEF1;color:#39424E;border-color:#B7BDC6}
.st{font-weight:600}.Ativo .st{color:var(--ok)}.Em\ risco .st{color:var(--warn)}.Inativo .st{color:var(--bad)}
.cr{border:1px solid var(--bad);color:var(--bad);border-radius:5px;padding:0 6px;font-weight:600}
.right{display:flex;align-items:center;gap:12px;justify-content:flex-end}
.mc{font-size:12px;color:var(--mut);white-space:nowrap}
.val{font-weight:700;min-width:84px;text-align:right}
.act a{text-decoration:none;font-size:18px;margin-left:6px;padding:4px}
.det{grid-column:1/-1;display:none;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.open .det{display:block}.det p{margin:3px 0}.det a{color:var(--acc)}
.empty{padding:30px;text-align:center;color:var(--mut)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.logo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:14px;text-align:center}
.logo img{display:block;margin:0 auto;max-width:100%;height:auto;max-height:56px}
.ov{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-weight:600}
.nb{background:var(--chip);border-radius:5px;padding:0 6px;font-weight:600;color:var(--ink)}
.nota{grid-column:1/-1;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;cursor:default}
.nota h3{font-size:14px;margin:0 0 8px}
.nota textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font:inherit;color:inherit}
.nota .fm{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.nota select{border:1px solid var(--line);background:var(--card);padding:7px 10px;border-radius:8px}
.nota .sv{border:0;background:var(--acc);color:#fff;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer}
.nota .sv[disabled]{opacity:.45;cursor:not-allowed}
.hist{display:grid;gap:6px;margin-bottom:10px}
.hi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.hi small{display:flex;justify-content:space-between;gap:8px;color:var(--mut);margin-bottom:3px}
.hi p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.hi .rs{font-weight:600;color:var(--acc)}
.hi .dl{border:0;background:none;color:var(--bad);cursor:pointer;padding:0 2px}
.nota .ms{color:var(--mut);font-size:13px;margin-top:6px}
@media (max-width:560px){.row{grid-template-columns:1fr}.right{justify-content:space-between}}
</style></head><body><main>

const full=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

function spark(m){const mx=Math.max(...m,1);return'<svg width="78" height="24" viewBox="0 0 78 24" aria-hidden="true">'+m.map((x,i)=>{const h=Math.max(x>0?2:0,Math.round(x/mx*22));return`<rect x="${i*6.5}" y="${24-h}" width="5" height="${h}" rx="1" fill="var(--acc)" opacity="${i===11?1:.55}"/>`}).join("")+"</svg>"}
function match(r){return f==="todos"||(f==="outros"&&OUT(r))||(f==="att"&&r[3]<=2)||f===r[1]||f===r[2]}
function draw(){
  const R=D[v].r,tot=R.reduce((a,r)=>a+r[5],0),n=k=>R.filter(r=>r[1]===k).length,att=R.filter(r=>r[3]<=2).length;
  $("tabs").innerHTML=D.map((d,i)=>`<button class="tab" aria-pressed="${i===v}" data-v="${i}">${esc(d.n)}</button>`).join("");
  $("kpis").innerHTML=`<div class="k"><small>Clientes</small><b>${R.length}</b><div class="abc"><span>Diamante ${n("Diamante")}</span><span>Platina ${n("Platina")}</span><span>Ouro ${n("Ouro")}</span><span>Prata ${n("Prata")}</span></div></div><div class="k"><small>Faturamento (jan/25 a nov/26)</small><b>${money(tot)}</b></div><div class="k att" data-att="1" role="button" tabindex="0"><small>Pedem atenção</small><b>${att}</b><small>clientes Diamante ou Platina sem comprar</small></div>`;
  if(f==="outros"&&!R.some(OUT))f="todos";
  $("chips").innerHTML=(R.some(OUT)?FL.concat([["outros","De outros vendedores"]]):FL).map(([k,t])=>`<button class="chip" aria-pressed="${f===k}" data-f="${k}">${t}</button>`).join("")+`<input type="search" id="q" placeholder="Buscar cliente" value="${esc(q)}" aria-label="Buscar cliente"><select id="s" aria-label="Ordenar"><option value="prio">Mais urgentes primeiro</option><option value="val">Maior faturamento</option><option value="rec">Compra mais recente</option></select>`;
  $("s").value=s;
  list();
}
function list(){
  let L=D[v].r.filter(r=>match(r)&&(r[0]+" "+(r[11]||"")).toLowerCase().includes(q.toLowerCase()));
  L.sort(s==="val"?(a,b)=>b[5]-a[5]:s==="rec"?(a,b)=>(a[10]??99)-(b[10]??99):(a,b)=>a[3]-b[3]||b[5]-a[5]);
  $("list").innerHTML=L.length?L.map(r=>{
    const ph=r[8]?r[8].split("  |  "):[],em=r[9]?r[9].split("; "):[];
    const k=key(r),hs=NT[k]||[];
    return`<li class="row ${r[2]}${OPEN.has(k)?" open":""}" data-k="${esc(k)}"><div><div class="nm">${esc(r[0])}</div><div class="sub"><span class="cl c-${esc(r[1])}" title="${esc(CTIP[r[1]]||"")}">${esc(r[1])}</span><span class="st">${r[2]}</span>${r[11]?`<span class="ov" title="Cliente do vendedor ${esc(r[11])}">👤 ${esc(r[11].split(" ")[0])}</span>`:""}${r[3]<=2?'<span class="cr">'+(r[3]===1?"Crítica":"Alta")+"</span>":""}${hs.length?`<span class="nb">📝 ${hs.length}</span>`:""}<span>${r[4]?"última compra "+r[4]+", ":""}${since(r[10])}</span></div></div>
<div class="right"><span class="mc" title="Meses com compra no período">${r[6]} ${r[6]===1?"mês":"meses"} c/ compra</span><div class="val">${money(r[5])}</div><div class="act">${ph[0]?`<a href="tel:${ph[0].replace(/\D/g,"")}" title="${esc(ph[0])}" aria-label="Ligar">📞</a>`:""}${em[0]?`<a href="mailto:${esc(em[0])}" title="${esc(em[0])}" aria-label="Enviar e-mail">✉️</a>`:""}</div></div>
<div class="det"><p><b>Faturamento jan/25 a nov/26:</b> ${full(r[5])}</p><p><b>Últimos 12 meses fechados (nov/25 a out/26):</b> ${r[12]!=null?full(r[12]):"sem faturamento na janela"}</p>${r[7]?`<p><b>Contato:</b> ${esc(r[7])}</p>`:""}<p><b>Telefone:</b> ${ph.length?ph.map(p=>`<a href="tel:${p.replace(/\D/g,"")}">${esc(p)}</a>`).join(" &nbsp; "):"não cadastrado"}</p><p><b>E-mail:</b> ${em.length?em.map(e=>`<a href="mailto:${esc(e)}">${esc(e)}</a>`).join("; "):"não cadastrado"}</p>${r[13]?`<p style="color:var(--mut);font-size:13px">Contato (ou parte dele) vindo da base antiga: confirme antes de usar.</p>`:""}
<div class="nota"><h3>Observações do contato</h3>${hs.length?`<div class="hist">${hs.map((h,i)=>`<div class="hi"><small><span>${esc(h.d)}${h.r?` · <span class="rs">${esc(h.r)}</span>`:""}</span><button class="dl" data-del="${i}" aria-label="Apagar observação" title="Apagar">✕</button></small><p>${esc(h.t)}</p></div>`).join("")}</div>`:""}
<textarea placeholder="Como foi o contato? Ex.: falei com o comprador, vai passar a lista de itens na sexta…" aria-label="Observação do contato">${esc(DR[k]?.t||"")}</textarea>
<div class="fm"><select aria-label="Resultado do contato"><option value="">Resultado (opcional)</option>${RES.map(o=>`<option${DR[k]?.r===o?" selected":""}>${o}</option>`).join("")}</select><button class="sv" data-save="1"${DR[k]?.t?.trim()?"":" disabled"}>Salvar observação</button></div>
<div class="ms">Salvas neste navegador.</div></div></div></li>`}).join(""):'<li class="empty">Nenhum cliente neste filtro. Limpe a busca ou escolha “Todos”.</li>';
}
function rowOf(el){const li=el.closest(".row");return li?D[v].r.find(r=>key(r)===li.dataset.k):null}
document.addEventListener("click",e=>{
  const nt=e.target.closest(".nota");
  if(nt){
    const r=rowOf(nt),k=key(r);
    if(e.target.closest("[data-save]")){
      const li=nt.closest(".row"),t=li.querySelector("textarea").value.trim(),rs=li.querySelector(".nota select").value;
      if(!t)return;
      (NT[k]=NT[k]||[]).unshift({d:new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}),t,r:rs});
      delete DR[k];persist();list();
    }else if(e.target.closest("[data-del]")){
      if(!confirm("Apagar esta observação?"))return;
      NT[k].splice(+e.target.closest("[data-del]").dataset.del,1);
      if(!NT[k].length)delete NT[k];persist();list();
    }
    return;
  }
  const t=e.target.closest("[data-v],[data-f],[data-att],.row");if(!t)return;
  if(t.dataset.v!==undefined){v=+t.dataset.v;draw()}
  else if(t.dataset.f){f=t.dataset.f;draw()}
  else if(t.dataset.att){f="att";draw()}
  else if(!e.target.closest("a")){const r=rowOf(t),k=key(r);t.classList.toggle("open");t.classList.contains("open")?OPEN.add(k):OPEN.delete(k)}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){q=e.target.value;list()}
  else if(e.target.closest(".nota")){
    const nt=e.target.closest(".nota"),k=key(rowOf(nt)),t=nt.querySelector("textarea").value,r=nt.querySelector("select").value;
    DR[k]={t,r};nt.querySelector("[data-save]").disabled=!t.trim();
  }
});
document.addEventListener("change",e=>{if(e.target.id==="s"){s=e.target.value;list()}else if(e.target.closest(".nota")){const nt=e.target.closest(".nota"),k=key(rowOf(nt));DR[k]={t:nt.querySelector("textarea").value,r:nt.querySelector("select").value}}});
draw();
</script></body></html>
